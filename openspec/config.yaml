  ## Продукт
  tg-chat-translator — переводчик переписки в Telegram: владелец и собеседник пишут
  каждый на своём языке и автоматически видят перевод, без кнопок. Продаётся как
  «коробка», которую нетехнический владелец ставит на свой сервер одной командой.
  Видение, механика и итоги живого теста — у автора локально: ../docs/проекты.md,
  раздел «Переводчик».

  Режимы:
  - личка: бот подключён к аккаунту владельца (Telegram Business / Chat Automation,
    нужен Premium). Собеседник пишет владельцу в обычную личку; владелец читает перевод
    и отвечает в теме «собеседник» в чате с ботом; бот отправляет перевод от имени
    владельца. Правило суток: от имени владельца можно писать только в чат, где
    собеседник сам писал за последние 24 часа;
  - через бота: собеседник открывает бота по ссылке и пишет ему,
    владелец работает в тех же темах. Premium не нужен;
  - группа: бот-админ переводит сообщения в общей группе.

  ## Домашний стандарт (полностью — у автора локально: ../CLAUDE.md)
  - TypeScript на Node 24+, .ts исполняется напрямую, без сборки. Зависимостей в проде —
    единицы. Состояние — один файл SQLite через встроенный node:sqlite.
  - Расширяемость обязательна: ядро — конвейер шагов вокруг общего типа данных
    (реплика), всё заменяемое — реестр реализаций (таблица или цепочка), а не if по
    месту. Каналы (Telegram-режимы), переводчики (провайдеры моделей) и способы доставки —
    реестры. Платные расширения подключаются в эти точки, не правя ядро.
  - Ядро не предполагает единственного владельца: одна программа должна уметь
    обслуживать многих — тогда облачный сервис не придётся переписывать.
  - Настройки живут в панели на инлайн-кнопках в боте, а не в файле. Значения из кода —
    дефолты первого запуска, источник правды — база. .env держит только то, что панель
    дать не может (токен бота, id владельца), и перебивает панель, если задано.
  - Доставка: Dockerfile + docker-compose.yml + install.sh одной командой. Long polling,
    не вебхуки: не нужны домен, SSL и открытый порт.
  - Тесты — встроенный node:test, без фреймворков. Обязательно покрывается то, что
    ломается молча: разбор апдейтов Telegram на сохранённых образцах, маршрутизация
    ответа владельца, правило суток, определение языка, дедуп, первый запуск. Сеть и
    модель в тестах не вызываются; живую проверку делает холостой прогон.
  - Обратная связь вместо логов: любая поломка уходит владельцу в личку Telegram.
  - Безопасность сразу: SSRF-фильтр на внешние запросы, экранирование перед разметкой,
    изоляция данных от инструкций в промпте модели (текст собеседника — данные).
  - Никаких утечек: ключи и токены — только в .env или базе, никогда в коде, логах и
    сообщениях об ошибках. Переписку хранить по минимуму: перевёл и забыл.
  - Документация для покупателя: README.md с таблицей «что видите / в чём дело» и
    УСТАНОВКА.md до каждого клика. Комментарии в коде — по-русски и объясняют «почему».

